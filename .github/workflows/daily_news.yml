name: Send Daily News to Kindle and Email

on:
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:

jobs:
  build_and_email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Fonts for Bengali PDF
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 fontconfig fonts-noto
          sudo cp kalpurush.ttf /usr/share/fonts/ || true
          sudo fc-cache -f -v

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Run News Fetcher and Sender
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          KINDLE_EMAIL: ${{ secrets.KINDLE_EMAIL }}
        run: python fetch_news.py
